name: DKC Race Control checks
on:
  push:
    branches: [dkc-control-test, main]
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: node scripts/test-api.mjs
      - name: Read IONOS deployment diagnostic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/Coolmopsrot/APP-DKC/check-suites/119869013204/check-runs --jq '.check_runs[] | {name, conclusion, output}' || true
